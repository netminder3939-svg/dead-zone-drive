  <div id="res"></div>

</div>
<button id="btnCenter" class="fab" title="Recenter on me">◎</button><button id="btnNear" class="fab" title="Nearby" onclick="UI.nearest()">📍</button><button id="btnDrive" class="fab" title="Drive mode" onclick="toggleDrive()">🚗</button>
<button id="btnClaim" class="fab claim" title="Build here">🏗️</button>
<nav id="tabs">

  <button data-tab="player">🧍<span>Player</span></button><button data-tab="alliance">🤝<span>Alliance</span></button>
  <button data-tab="inv">🎒<span>Inventory</span></button>
</nav>
<div id="sheet" class="hidden"><div class="grab"></div><button class="x" id="sheetX">✕</button><div id="sheetBody"></div></div>
<div id="modal" class="hidden"><div id="modalBody"></div></div>
<div id="onboard" class="hidden"><div class="card">
  <h1>DEAD ZONE DRIVE</h1><p>The world ended and the Blight came after. Mutants crawl out of the dead zones and raider warbands march under old, ugly banners. Your crew keeps the last fires burning. Take the land back, one hex at a time.</p>
  <input id="obName" placeholder="Your name" maxlength="16"><input id="obTeam" placeholder="Team code">
  <div class="colors" id="obColors"></div><button id="obGo" class="big">Enter the Wastes</button>
  <p class="tiny">Location is only used while this page is open.</p></div></div>
